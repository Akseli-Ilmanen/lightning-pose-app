<div
  class="plot-area relative w-full cursor-crosshair select-none touch-none outline-none focus-visible:ring-1 focus-visible:ring-primary"
  role="group"
  tabindex="0"
  [attr.aria-label]="ariaLabel()"
  [style.height.px]="height()"
  (keydown)="onKeyDown($event)"
>
  <canvas #base class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
  <canvas
    #overlay
    class="absolute inset-0 w-full h-full"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
    (wheel)="onWheel($event)"
    (dblclick)="resetZoom()"
    (contextmenu)="$event.preventDefault()"
  ></canvas>

  <!-- Legend inside the plot, top right, like pyqtgraph's LegendItem. -->
  <!-- The heatmap's colour bar is drawn on the canvas, right of the plot. -->
  @if (mode() === 'lines' && (legend().length > 1 || legend()[0]?.label)) {
    <div
      class="absolute top-2 right-3 max-w-[50%] max-h-[70%] overflow-hidden flex flex-col rounded-sm border border-black/20 bg-white/85 px-1.5 py-0.5 text-[11px] leading-4 text-black pointer-events-none"
    >
      @for (item of legend(); track item.label) {
        <span class="flex items-center gap-1.5 whitespace-nowrap">
          <span
            class="inline-block w-4 border-t-2"
            [class.border-dashed]="item.dashed"
            [style.border-color]="item.color"
          ></span>
          <span class="truncate">{{ item.label }}</span>
          <span class="ml-auto pl-2 tabular-nums opacity-70">{{ item.value }}</span>
        </span>
      }
    </div>
  }

  <!-- pyqtgraph's auto-range "A" button, bottom left. -->
  @if (isZoomed()) {
    <button
      type="button"
      class="absolute bottom-0.5 left-1 h-5 w-5 rounded-sm border border-black/30 bg-white text-[11px] font-semibold text-black hover:bg-black/10"
      aria-label="Show whole video"
      title="Autoscale (A)"
      (click)="resetZoom()"
    >
      A
    </button>
  }
</div>
